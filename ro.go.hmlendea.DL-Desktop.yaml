app-id: ro.go.hmlendea.DL-Desktop
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
separate-locales: false
command: dl-desktop

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network

modules:
  - name: dl-desktop-x86_64
    only-arches: [x86_64]
    buildsystem: simple
    build-commands:
      - unzip -d "dl-desktop" "dl-desktop.zip"
      - cp -r "dl-desktop" /app
      - install -Dm 644 "icon.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm 644 "dl-desktop/${FLATPAK_ID}.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm 644 "${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - install -Dm 755 "dl-desktop.sh" "/app/bin/dl-desktop"
      - desktop-file-edit "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
        --set-key "Exec" --set-value "dl-desktop" --set-key "Icon" --set-value "${FLATPAK_ID}"
    sources:
      - type: file
        url: https://github.com/hmlendea/dl-desktop/releases/download/v4.3.2/dl-desktop_4.3.2_linux_x64.zip
        dest-filename: dl-desktop.zip
        sha256: 9a52a0459e4b135ac977893b91d7d4281445cd730b21ab944f9be10a8d6901f1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/hmlendea/dl-desktop/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="dl-desktop_" + $version + "_linux_x64.zip")
            | .browser_download_url
      - type: file
        path: ro.go.hmlendea.DL-Desktop.metainfo.xml
      - type: file
        url: https://raw.githubusercontent.com/hmlendea/dl-desktop/3335b88fe52d9637de154a4295a542647169d1e0/icon.png
        dest-filename: icon.png
        sha256: 67642cd03a241ff097a83800f39e442c533e8b7a92a9235c0375ef866a708f0e
      - type: script
        dest-filename: dl-desktop.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - cd /app/dl-desktop
          - exec zypak-wrapper /app/dl-desktop/dl-desktop /app/dl-desktop/dl-desktop
            "$@"
  - name: dl-desktop-aarch64
    only-arches: [aarch64]
    buildsystem: simple
    build-commands:
      - unzip -d "dl-desktop" "dl-desktop.zip"
      - cp -r "dl-desktop" /app
      - install -Dm 644 "icon.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm 644 "dl-desktop/${FLATPAK_ID}.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm 644 "${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - install -Dm 755 "dl-desktop.sh" "/app/bin/dl-desktop"
      - desktop-file-edit "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
        --set-key "Exec" --set-value "dl-desktop" --set-key "Icon" --set-value "${FLATPAK_ID}"
    sources:
      - type: file
        url: https://github.com/hmlendea/dl-desktop/releases/download/v4.3.2/dl-desktop_4.3.2_linux_arm64.zip
        dest-filename: dl-desktop.zip
        sha256: 630ed6acef0d2b6b3a8cb7caff51edbf983cf918926895925a1394a4aa2afddd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/hmlendea/dl-desktop/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="dl-desktop_" + $version + "_linux_arm64.zip")
            | .browser_download_url
      - type: file
        path: ro.go.hmlendea.DL-Desktop.metainfo.xml
      - type: file
        url: https://raw.githubusercontent.com/hmlendea/dl-desktop/3335b88fe52d9637de154a4295a542647169d1e0/icon.png
        dest-filename: icon.png
        sha256: 67642cd03a241ff097a83800f39e442c533e8b7a92a9235c0375ef866a708f0e
      - type: script
        dest-filename: dl-desktop.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - cd /app/dl-desktop
          - exec zypak-wrapper /app/dl-desktop/dl-desktop /app/dl-desktop/dl-desktop
            "$@"
